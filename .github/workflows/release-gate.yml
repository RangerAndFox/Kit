name: Release gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validate migration history
        run: npm run check:migrations

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prevent new ESLint debt
        run: npm run lint:ratchet
      - name: TypeScript
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:app
      - name: Production build
        run: npx next build --webpack

  slack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            bolt/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: bolt
      - run: npm test
        working-directory: bolt
      - run: npx tsc --noEmit
        working-directory: bolt

  render-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kit-render-worker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kit-render-worker/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  browser-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kit-behance-worker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kit-behance-worker/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  deadline-relay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kit-deadline-relay
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kit-deadline-relay/package-lock.json
      - run: npm ci
      - run: npm run build

  dependency-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory: ['.', bolt, kit-render-worker, kit-behance-worker, kit-deadline-relay]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm audit --omit=dev --audit-level=high
